<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Mangoê · Administração</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--g:#0F2A1D;--g2:#17402B;--cream:#FFF6DC;--y:#F5B800;--mut:#5C6B5F;--line:#E7DDB8;--bg:#F4F1E6;--red:#B3261E;--ok:#1E7B4A;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.2}
header{background:var(--g);color:var(--cream);position:sticky;top:0;z-index:5}
header .in{max-width:1200px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header b{font:800 20px "Bricolage Grotesque",sans-serif;margin-right:8px}
.tabs{display:flex;gap:6px;flex:1}.tabs button,.btn{border:0;border-radius:99px;font:700 14px "DM Sans",sans-serif;padding:8px 16px;cursor:pointer}
.tabs button{background:transparent;color:var(--cream)}.tabs .on{background:var(--y);color:var(--g)}
.btn{background:var(--y);color:var(--g)}.btn.g{background:var(--line)}.btn.d{background:var(--red);color:#fff}.btn.s{padding:6px 12px;font-size:13px}
main{max-width:1200px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.k{color:var(--mut);font-size:13px}.big{font:800 24px "Bricolage Grotesque",sans-serif}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}@media(max-width:860px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
tr.o{cursor:pointer}tr.o:hover,tr.sel{background:var(--cream)}.sc{overflow:auto;max-height:70vh}
.b{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--line)}
.b.novo{background:var(--y)}.b.em_preparo{background:#FFD9A0}.b.saiu_entrega{background:#CBE7FF}.b.entregue{background:#CDEFD8;color:var(--ok)}.b.cancelado{background:#F6D3D0;color:var(--red)}
select,input{font:inherit;color:var(--g);background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
input[type=email],input[type=password]{width:100%}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.msg{color:var(--red);font-weight:700;min-height:1.4em}.ok{color:var(--ok)}
.it{padding:8px 0;border-bottom:1px solid var(--line)}.it small{display:block;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SBU='https://uwwrzpzjwcegonrntbio.supabase.co',KEY='sb_publishable_g4gdE7lepqwJHC1vh0E51Q_HpQCdQ6G';
const sb=supabase.createClient(SBU,KEY);
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={novo:'Novo',em_preparo:'Em preparo',saiu_entrega:'Saiu para entrega',entregue:'Entregue',cancelado:'Cancelado'};
let tab='pedidos',P='7d',F='todos',orders=[],sel=null,COST=null,timer=null,user='';
const dt=s=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function range(){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),D=864e5;let a,b=new Date(d0.getTime()+D);
if(P=='hoje')a=d0;else if(P=='7d')a=new Date(d0.getTime()-6*D);else if(P=='30d')a=new Date(d0.getTime()-29*D);else if(P=='mes')a=new Date(n.getFullYear(),n.getMonth(),1);else if(P=='mesant'){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),1)}else{a=new Date(2000,0,1);b=new Date(2100,0,1)}return[a.toISOString(),b.toISOString()]}
function login(msg='',ok=false){clearInterval(timer);$('#app').innerHTML=`<div class="login card"><h1>Mangoê · Administração</h1><p class="k">Entre com o e-mail e a senha do administrador.</p><p><input id="em" type="email" placeholder="E-mail" autocomplete="username"></p><p><input id="pw" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password"></p><p class="msg ${ok?'ok':''}" id="lm">${esc(msg)}</p><button class="btn" id="go">Entrar</button> <button class="btn g" id="new">Criar conta</button></div>`;
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#lm').textContent='Não foi possível entrar: '+error.message;else boot()};
$('#new').onclick=async()=>{const{error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{emailRedirectTo:location.origin+'/admin/'}});if(error)$('#lm').textContent=error.message;else login('Conta criada. Abra o e-mail que você recebeu, confirme e depois volte aqui para entrar.',true)}}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();user=session.user.email;const{data:ok,error}=await sb.rpc('is_admin');
if(error||!ok){$('#app').innerHTML=`<div class="login card"><h1>Sem permissão</h1><p>A conta <b>${esc(user)}</b> não está autorizada como administradora.</p><button class="btn g" id="out">Sair</button></div>`;$('#out').onclick=async()=>{await sb.auth.signOut();login()};return}
shell();await refresh();clearInterval(timer);timer=setInterval(()=>{if(tab=='pedidos')refresh(true)},30000)}
function shell(){$('#app').innerHTML=`<header><div class="in"><b>Mangoê</b><div class="tabs"><button data-t="pedidos">Pedidos</button><button data-t="fin">Financeiro</button></div><span class="k" style="color:#C9D8C8">${esc(user)}</span><button class="btn s g" id="out">Sair</button></div></header><main id="main"></main>`;
$('#out').onclick=async()=>{await sb.auth.signOut();login()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;refresh()})}
async function refresh(quiet){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const[a,b]=range();
const{data,error}=await sb.from('orders').select('*,order_items(*)').gte('created_at',a).lt('created_at',b).order('created_at',{ascending:false}).limit(2000);
if(error){$('#main').innerHTML='<div class="card msg">Erro ao carregar: '+esc(error.message)+'</div>';return}
orders=data;const n=orders.filter(o=>o.status=='novo').length;document.title=(n?'('+n+') ':'')+'Mangoê · Administração';
if(tab=='fin')await finView();else pedView()}
function filt(){return `<div class="row"><select id="per">${[['hoje','Hoje'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['mes','Este mês'],['mesant','Mês passado'],['tudo','Tudo']].map(x=>`<option value="${x[0]}" ${P==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`}
function bindPer(){$('#per').onchange=e=>{P=e.target.value;refresh()}}
function pedView(){const list=orders.filter(o=>F=='todos'||(F=='ativos'?['novo','em_preparo','saiu_entrega'].includes(o.status):o.status==F));
$('#main').innerHTML=filt()+`<select id="fs"><option value="todos">Todos os estados</option><option value="ativos" ${F=='ativos'?'selected':''}>Em andamento</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${F==k?'selected':''}>${v}</option>`).join('')}</select><button class="btn s g" id="rf">Atualizar</button><span class="k">${list.length} pedido(s) · atualiza sozinho a cada 30 s</span></div>
<div class="two"><div class="card sc"><table><tr><th>Nº</th><th>Hora</th><th>Cliente</th><th>Tipo</th><th class="r">Total</th><th>Estado</th></tr>${list.map(o=>`<tr class="o ${sel==o.id?'sel':''}" data-id="${o.id}"><td>#${o.number}</td><td>${dt(o.created_at)}</td><td>${esc(o.customer_name)}</td><td>${o.delivery_type=='entrega'?esc(o.neighborhood):'Retirada'}</td><td class="r">${R(o.total)}${o.fee_pending&&o.delivery_fee==null?'*':''}</td><td><span class="b ${o.status}">${ST[o.status]}</span></td></tr>`).join('')||'<tr><td colspan="6" class="k">Nenhum pedido neste período.</td></tr>'}</table></div><div id="det"></div></div>`;
bindPer();$('#fs').onchange=e=>{F=e.target.value;pedView()};$('#rf').onclick=()=>refresh();document.querySelectorAll('tr.o').forEach(r=>r.onclick=()=>{sel=r.dataset.id;pedView()});detail()}
function detail(){const o=orders.find(x=>x.id==sel),d=$('#det');if(!o){d.innerHTML='<div class="card k">Selecione um pedido para ver todos os detalhes.</div>';return}
const ph=o.customer_phone,wa='https://wa.me/'+(ph.length<=11?'55'+ph:ph);
d.innerHTML=`<div class="card"><h2>Pedido #${o.number} <span class="b ${o.status}">${ST[o.status]}</span></h2><p class="k">${dt(o.created_at)}</p>
<p><b>${esc(o.customer_name)}</b><br><a href="${wa}" target="_blank" rel="noopener">${esc(ph)} · abrir no WhatsApp</a></p>
${o.delivery_type=='entrega'?`<p><b>Entrega</b><br>${esc(o.street)}, nº ${esc(o.street_number)}<br>Bairro ${esc(o.neighborhood)}${o.zone_name?' ('+esc(o.zone_name)+')':''}${o.complement?'<br>Compl.: '+esc(o.complement):''}${o.reference?'<br>Ref.: '+esc(o.reference):''}</p>`:'<p><b>Retirada no local</b></p>'}
${o.order_items.map(i=>`<div class="it"><b>${i.qty}x ${esc(i.product_name)} ${i.size_ml} ml</b> · ${R(i.qty*i.unit_price)}<small>${i.maturation?'Ponto: '+esc(i.maturation)+' · ':''}Temperos: ${esc((i.toppings||[]).join(', ')||'sem tempero')}${i.note?' · Obs: '+esc(i.note):''}</small></div>`).join('')}
<p style="margin-top:10px">Potes: ${R(o.items_total)}<br>Entrega: ${o.delivery_type!='entrega'?'—':o.delivery_fee==null?'<b>a combinar</b>':R(o.delivery_fee)}<br><b>Total: ${R(o.total)}</b></p>
<div class="row">${o.fee_pending&&o.delivery_type=='entrega'?'<button class="btn s" data-a="fee">Definir taxa de entrega</button>':''}</div>
<p class="k">Mudar estado:</p><div class="row">${Object.entries(ST).map(([k,v])=>`<button class="btn s ${o.status==k?'':'g'} ${k=='cancelado'?'d':''}" data-st="${k}">${v}</button>`).join('')}</div><p class="msg" id="dm"></p></div>`;
d.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{if(b.dataset.st=='cancelado'&&!confirm('Cancelar este pedido?'))return;const{error}=await sb.from('orders').update({status:b.dataset.st}).eq('id',o.id);if(error)$('#dm').textContent=error.message;else refresh()});
const fb=d.querySelector('[data-a=fee]');if(fb)fb.onclick=async()=>{const v=prompt('Valor da taxa de entrega (ex.: 12,00):');if(v===null)return;const f=parseFloat(v.replace(',','.'));if(!(f>=0)){$('#dm').textContent='Valor inválido';return}
const{error}=await sb.from('orders').update({delivery_fee:f,fee_pending:false,total:+o.items_total+f}).eq('id',o.id);if(error)$('#dm').textContent=error.message;else refresh()}}
async function costs(){if(COST)return COST;const[pc,pr,tc,st]=await Promise.all([sb.from('product_costs').select('*'),sb.from('products').select('id,slug'),sb.from('topping_costs').select('*,toppings(name)'),sb.from('settings').select('value').eq('key','cfg').maybeSingle()]);
const cfg=st.data?st.data.value:{},slug={},base={},top={};(pr.data||[]).forEach(p=>slug[p.id]=p.slug);
(pc.data||[]).forEach(c=>{base[slug[c.product_id]+'|'+c.size_ml]={fr:((+c.grams_mango)*cfg.kgM/((cfg.rM||100)/100)+(+c.grams_pineapple)*cfg.kgA/((cfg.rA||100)/100))/1000,emb:(+c.packaging)+(+c.other_cost)}});
(tc.data||[]).forEach(t=>{if(t.toppings)top[t.toppings.name]={cu:t.pack_qty>0?t.pack_price/t.pack_qty:0,d1:+t.dose_250,d2:+t.dose_500}});return COST={cfg,base,top}}
function calc(list){const C=COST,ok=list.filter(o=>o.status!='cancelado'),T={ped:ok.length,canc:list.length-ok.length,pot:0,prod:0,fee:0,fr:0,emb:0,tem:0,pend:0,ent:0},byP={},byT={},byM={},byN={},byD={};
ok.forEach(o=>{T.prod+=+o.items_total;T.fee+=+(o.delivery_fee||0);if(o.delivery_type=='entrega'){T.ent++;if(o.delivery_fee==null)T.pend++;const k=o.neighborhood||'?';(byN[k]=byN[k]||{n:0,v:0}).n++;byN[k].v+=+(o.delivery_fee||0)}
const dk=new Date(o.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});byD[dk]=(byD[dk]||0)+(+o.total);
o.order_items.forEach(i=>{const k=i.product_name+' '+i.size_ml+' ml',b=C.base[i.product_slug+'|'+i.size_ml]||{fr:0,emb:0};let tc=0;(i.toppings||[]).forEach(t=>{const x=C.top[t];if(x)tc+=(i.size_ml==250?x.d1:x.d2)*x.cu;byT[t]=(byT[t]||0)+i.qty});
const p=byP[k]=byP[k]||{q:0,v:0,c:0};p.q+=i.qty;p.v+=i.qty*i.unit_price;p.c+=i.qty*(b.fr+b.emb+tc);T.pot+=i.qty;T.fr+=i.qty*b.fr;T.emb+=i.qty*b.emb;T.tem+=i.qty*tc;if(i.maturation)byM[i.maturation]=(byM[i.maturation]||0)+i.qty})});
T.rev=T.prod+T.fee;T.imp=T.rev*((C.cfg.imp||0)+(C.cfg.outras||0))/100;T.entc=T.ent*(C.cfg.entProp||0);T.res=T.rev-T.fr-T.emb-T.tem-T.imp-T.entc;return{T,byP,byT,byM,byN,byD}}
const tb=(h,rows)=>`<div class="sc"><table><tr>${h.map((x,i)=>`<th class="${i?'r':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i?'r':''}">${x}</td>`).join('')}</tr>`).join('')||'<tr><td class="k" colspan="9">Sem dados.</td></tr>'}</table></div>`;
async function finView(){await costs();const{T,byP,byT,byM,byN,byD}=calc(orders),K=(l,v,c='')=>`<div class="card"><div class="k">${l}</div><div class="big ${c}">${v}</div></div>`;
const prods=Object.entries(byP).sort((a,b)=>b[1].q-a[1].q),tops=Object.entries(byT).sort((a,b)=>b[1]-a[1]),mats=Object.entries(byM),nbs=Object.entries(byN).sort((a,b)=>b[1].n-a[1].n).slice(0,12),days=Object.entries(byD).reverse();
const mx=Math.max(1,...days.map(d=>d[1])),mt=mats.reduce((a,b)=>a+b[1],0),mp=Math.max(1,...tops.map(t=>t[1]));
$('#main').innerHTML=filt()+`<span class="k">Considera os pedidos do site que não foram cancelados. Vendas do iFood não entram aqui.</span></div>
<div class="grid">${K('Pedidos',T.ped+(T.canc?' ('+T.canc+' cancelado'+(T.canc>1?'s':'')+')':''))}${K('Potes vendidos',T.pot)}${K('Faturamento dos potes',R(T.prod))}${K('Taxas de entrega',R(T.fee)+(T.pend?' (+'+T.pend+' a definir)':''))}${K('Total cobrado',R(T.rev))}${K('Ticket médio',R(T.ped?T.rev/T.ped:0))}</div>
<div class="card"><h3>Resultado estimado</h3><p class="k">Total cobrado, menos custo das frutas, embalagens, temperos, impostos e entrega própria, usando os custos cadastrados no sistema. É uma estimativa antes das despesas fixas.</p>
<div class="grid"><div><div class="k">Frutas</div><b>${R(T.fr)}</b></div><div><div class="k">Embalagens e outros</div><b>${R(T.emb)}</b></div><div><div class="k">Temperos</div><b>${R(T.tem)}</b></div><div><div class="k">Impostos e outras</div><b>${R(T.imp)}</b></div><div><div class="k">Entrega própria (${T.ent})</div><b>${R(T.entc)}</b></div><div><div class="k">Resultado estimado</div><b class="big" style="color:${T.res<0?'var(--red)':'var(--ok)'}">${R(T.res)}</b></div></div></div>
<div class="two"><div class="card"><h3>Faturamento por dia</h3>${days.length?`<svg viewBox="0 0 ${Math.max(300,days.length*28)} 140" width="100%" style="max-height:200px">${days.map((d,i)=>{const h=Math.max(2,d[1]/mx*100);return`<rect x="${i*28+4}" y="${112-h}" width="20" height="${h}" rx="3" fill="#F5B800"><title>${d[0]}: ${R(d[1])}</title></rect><text x="${i*28+14}" y="130" font-size="9" text-anchor="middle" fill="#5C6B5F">${d[0]}</text>`}).join('')}</svg>`:'<p class="k">Sem dados.</p>'}</div>
<div class="card"><h3>Ponto da manga</h3>${mats.map(m=>`<p>${esc(m[0])}: ${m[1]} (${N(m[1]/mt*100)}%)<span class="bar" style="display:block"><i style="width:${m[1]/mt*100}%"></i></span></p>`).join('')||'<p class="k">Sem dados.</p>'}</div></div>
<div class="card"><h3>Produtos</h3>${tb(['Produto','Qtd','Faturamento','Custo estimado','Lucro estimado','% do faturamento'],prods.map(([k,p])=>[esc(k),p.q,R(p.v),R(p.c),R(p.v-p.c),N(T.prod?p.v/T.prod*100:0)+'%']))}</div>
<div class="two"><div class="card"><h3>Temperos mais pedidos</h3>${tops.map(t=>`<p style="margin:6px 0">${esc(t[0])}: ${t[1]}<span class="bar" style="display:block"><i style="width:${t[1]/mp*100}%"></i></span></p>`).join('')||'<p class="k">Sem dados.</p>'}</div>
<div class="card"><h3>Bairros que mais pedem</h3>${tb(['Bairro','Pedidos','Taxas'],nbs.map(([k,v])=>[esc(k),v.n,R(v.v)]))}</div></div>`;bindPer()}
sb.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
