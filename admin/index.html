header .in .tabs{order:5;flex:1 1 100%;flex-wrap:wrap;overflow:visible;gap:4px}header .in .tabs button{padding:7px 12px}header .in>b{order:1}header .in>.btn,header .in>.k{order:2}header .in>#out{order:3;margin-left:auto}
.prep{background:#FFF8E1;border:2px solid var(--y);border-radius:14px;padding:12px 14px;margin:12px 0}.prep h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.bi{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}.bi:last-child{border-bottom:0}.bq{font:800 36px/1 "DM Sans",sans-serif;min-width:70px;color:var(--g)}.bn{font-size:24px;font-weight:800;line-height:1.15}.bf{font-size:20px;font-weight:700;color:#7A5A00;margin-top:3px}.bo{margin-top:6px;background:#fff;border-left:5px solid var(--red);padding:6px 10px;font-size:19px;font-weight:700;border-radius:6px}.bp{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}td.li{font-weight:700;font-size:15px;min-width:180px}.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}@media(max-width:860px){.two{grid-template-columns:1fr}}

function login(msg='',ok=false){clearInterval(timer);$('#app').innerHTML=`<div class="login card"><h1>Mangoê · Administração</h1><p class="k">Entre com o e-mail e a senha do administrador.</p><p><input id="em" type="email" placeholder="E-mail" autocomplete="username"></p><p><input id="pw" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password"></p><p class="msg ${ok?'ok':''}" id="lm">${esc(msg)}</p><button class="btn" id="go">Entrar</button> <button class="btn g" id="new">Criar conta</button></div>`;

const{error}=await sb.from('site_settings').upsert({key:'store_open',value:nv?'true':'false'},{onConflict:'key'});if(error){alert('Erro ao salvar: '+error.message);return}STORE=nv;storeDraw()}}
async function refresh(quiet){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));if(EDV[tab]){await EDV[tab]();return}const[a,b]=range();

<div class="two"><div class="card sc"><table><tr><th>Nº</th><th>Hora</th><th>Cliente</th><th>Itens</th><th>Tipo</th><th class="r">Total</th><th>Estado</th></tr>${list.map(o=>`<tr class="o ${sel==o.id?'sel':''}" data-id="${o.id}"><td>#${o.number}</td><td>${dt(o.created_at)}</td><td>${esc(o.customer_name)}</td><td class="li">${o.order_items.map(i=>i.qty+'x '+esc(i.product_name)+' '+i.size_ml+'ml').join(', ')}</td><td>${o.delivery_type=='entrega'?esc(o.neighborhood):'Retirada'}</td><td class="r">${R(o.total)}${o.fee_pending&&o.delivery_fee==null?'*':''}</td><td><span class="b ${o.status}">${ST[o.status]}</span></td></tr>`).join('')||'<tr><td colspan="7" class="k">Nenhum pedido neste período.</td></tr>'}</table></div><div id="det"></div></div>`;
bindPer();$('#fs').onchange=e=>{F=e.target.value;pedView()};$('#rf').onclick=()=>refresh();$('#cl').onclick=async()=>{const rot=false;try{const{data,error}=await sb.rpc('courier_token',{rotate:rot});if(error)throw error;const u=location.origin+'/entregador/?k='+data;let ok=false;try{await navigator.clipboard.writeText(u);ok=true}catch(e){}
const w=prompt((ok?'Link copiado! ':'')+'Link do entregador (guarde só com ele). Para mandar por WhatsApp, copie e cole. Se quiser invalidar este link e criar outro, digite TROCAR e confirme:',u);if(w&&w.trim().toUpperCase()=='TROCAR'){const r2=await sb.rpc('courier_token',{rotate:true});if(r2.error)throw r2.error;const n=location.origin+'/entregador/?k='+r2.data;try{await navigator.clipboard.writeText(n)}catch(e){}prompt('Novo link criado (o antigo parou de funcionar):',n)}}catch(e){alert('Erro: '+(e.message||e))}};document.querySelectorAll('tr.o').forEach(r=>r.onclick=()=>{sel=r.dataset.id;pedView()});detail()}
function detail(){const o=orders.find(x=>x.id==sel),d=$('#det');if(!o){d.innerHTML='<div class="card k">Selecione um pedido para ver todos os detalhes.</div>';return}
const ph=o.customer_phone,wa='https://wa.me/'+(ph.length<=11?'55'+ph:ph);
let dl='';if(o.delivery_type=='entrega'){const ad=[o.street+', '+o.street_number,o.neighborhood,'Divinópolis - MG'].join(', '),maps='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(ad),tx='Valor do frete: '+(o.fee_pending||o.delivery_fee==null?'a combinar':+o.delivery_fee===0?'grátis':R(o.delivery_fee)),vl='Valor do pedido (com a entrega): '+R(o.total)+(o.fee_pending?' (mais a entrega, a combinar)':''),pgL=o.payment_method=='dinheiro'?[vl,tx,'💵 Pagamento: DINHEIRO, cobrar '+R(o.total),o.change_for?'Troco para '+R(o.change_for)+': levar '+R(o.change_for-o.total)+' de troco':'Sem troco']:o.payment_method=='pix'?[vl,tx,'Pagamento: Pix']:[vl,tx,'Pagamento: não informado'];

L.push('','Itens: '+o.order_items.map(i=>i.qty+'x '+i.product_name+' '+i.size_ml+' ml').join('; '),'',...pgL,'','Iniciar rota: '+maps);
dl=`<div class="row"><a class="btn s" href="https://wa.me/${CPH?'55'+CPH:''}?text=${encodeURIComponent(L.join('\n'))}" target="_blank" rel="noopener">Enviar ao entregador${CNM?' ('+esc(CNM)+')':''}</a><a class="btn s g" href="${maps}" target="_blank" rel="noopener">Abrir rota no Maps</a></div>`}
const REVIEW='',PIXKEY='37991222354 (telefone)',PIXNOME='Marcia Helena de Jesus',AV={novo:'Recebido',em_preparo:'Em preparo',saiu_entrega:o.delivery_type=='entrega'?'Saiu para entrega':'Pronto para retirada',entregue:'Entregue'},fn=(o.customer_name||'').trim().split(/\s+/)[0]||'',en=o.delivery_type=='entrega',pgd=o.payment_method=='dinheiro'?' Pagamento em dinheiro: '+R(o.total)+'.':'';
const PIXMSG=o.payment_method=='pix'&&PIXKEY?'\n\n💠 *Pagamento via Pix*\nChave Pix: '+PIXKEY+(PIXNOME?'\nNome: '+PIXNOME:'')+'\nValor: '+R(o.total)+(o.fee_pending?' (mais a entrega, a combinar)':'')+'\n\nAssim que efetuar o pagamento, envie o comprovante por aqui, por favor. 🙏':'';
const AM={novo:'Olá, '+fn+'! Aqui é da Mangoê. Recebemos o seu pedido nº '+o.number+' (total '+R(o.total)+'). Já já avisamos quando começarmos o preparo. 😊'+PIXMSG,

saiu_entrega:en?'Olá, '+fn+'!\n\nSeu pedido saiu para a entrega! 🛵🥭💚\n\nEsperamos que você ame cada pedacinho! Depois conta pra gente o que achou. Sua opinião é muito importante para nós!\n\nA Mangoê agradece a preferência. Volte sempre! 💚':'Olá, '+fn+'! Seu pedido nº '+o.number+' está pronto para retirada. Te esperamos! 🥭💚',
