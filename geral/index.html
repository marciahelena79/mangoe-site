const lst=B.filter(b=>(BF=='todas'||(BF=='pagas'?b.paid_at:!b.paid_at))&&(BS=='todas'||b.store==BS));
const byC={},byS={geral:0,mangoe:0,bistro:0};B.filter(b=>b.paid_at).forEach(b=>{byC[b.category]=(byC[b.category]||0)+ +b.amount;byS[b.store]+= +b.amount});
const sel=(opts,cur,att)=>`<select ${att}>${opts.map(o=>`<option value="${o[0]}" ${o[0]==cur?'selected':''}>${o[1]}</option>`).join('')}</select>`,co=BCAT.map(c=>[c,c]),so=Object.entries(BST),mo=[['','Forma'],...BMET.map(x=>[x,x])];
const inp=(b,c,ty,w)=>`<input type="${ty}" data-bf="${b.id}|${c}" value="${esc(b[c]??'')}" style="width:${w}px"${c=='amount'?' inputmode="decimal"':''}>`;
const KK=(l,v,c='',x='')=>`<div class="card" ${x}><div class="k">${l}</div><div class="big ${c}">${v}</div></div>`;
$('#main').innerHTML=`<div class="row"><span class="k">Contas do mês pelo vencimento. Faturamento = só itens, Mangoê + DonaLia.</span><span class="msg" id="bmsg" style="color:var(--ok)"></span></div>
<div class="grid">${KK('Contas pagas',R(paid))}${KK('Contas a pagar'+(late?` · <b class="neg">${late} vencida(s)</b>`:''),R(pend))}${KK('Faturamento das duas lojas',R(fat))}${KK('Faturamento − contas pagas',R(fat-paid),fat-paid<0?'neg':'pos','style="border:2px solid var(--g)"')}${KK('Faturamento − todas as contas (pagas + a pagar)',R(fat-paid-pend),fat-paid-pend<0?'neg':'')}</div>
<div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:8px">Faturamento × contas do mês</h3>${(()=>{const it=[['Faturamento',fat,'#1E7B4A'],['Contas pagas',paid,'#B3261E'],['Contas a pagar',pend,'#E08A00'],['Sobra (fat. − contas pagas)',Math.max(0,fat-paid),'#0F2A1D']],mx=Math.max(1,fat,paid,pend);return it.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><div style="width:190px" class="k">${x[0]}</div><div style="flex:1;background:#eee;border-radius:99px;height:22px;overflow:hidden"><i style="display:block;height:100%;width:${x[1]/mx*100}%;background:${x[2]};border-radius:99px"></i></div><b style="width:120px;text-align:right">${R(x[1])}</b></div>`).join('')+`<p class="k" style="margin-top:8px">Contas pagas = ${PC(fat?paid/fat*100:0)} do faturamento · com as contas a pagar, ${PC(fat?(paid+pend)/fat*100:0)}.</p>`})()}</div>
<div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:8px">Adicionar conta</h3><div class="row">${sel(so,'geral','id="n_s"')}<input id="n_d" type="text" placeholder="Descrição (ex.: Conta de luz)" style="width:220px">${sel(co,'Outros','id="n_c"')}<input id="n_v" type="text" inputmode="decimal" placeholder="Valor R$" style="width:100px"><label class="k">Vencimento</label><input id="n_due" type="date" value="${hj}" style="width:150px"><label class="k">Paga em</label><input id="n_p" type="date" style="width:150px">${sel(mo,'','id="n_m"')}<input id="n_n" type="text" placeholder="Observação" style="width:170px"><button class="btn" id="n_add">Adicionar</button></div><p class="k">Loja "Geral" é a conta das duas (aluguel, internet…). Se preencher "Paga em", a conta já entra como paga; em branco fica a pagar.</p><p class="msg" id="n_msg"></p></div>
<div class="card" style="margin-bottom:14px"><div class="row" style="margin-bottom:8px"><h3 style="margin-right:auto">Contas</h3>${sel([['todas','Todas'],['pagas','Só pagas'],['pend','Só pendentes']],BF,'id="bf"')}${sel([['todas','Todas as lojas'],...so],BS,'id="bs"')}</div><div style="overflow-x:auto"><table><tr><th>Loja</th><th>Descrição</th><th>Categoria</th><th>Valor R$</th><th>Vencimento</th><th>Paga em</th><th>Forma</th><th>Obs.</th><th></th></tr>${lst.map(b=>`<tr style="${b.paid_at?'':b.due_date<hj?'background:#FBE9E7':''}"><td>${sel(so,b.store,`data-bf="${b.id}|store"`)}</td><td>${inp(b,'description','text',190)}</td><td>${sel(co,b.category,`data-bf="${b.id}|category"`)}</td><td>${inp(b,'amount','text',90)}</td><td>${inp(b,'due_date','date',140)}</td><td>${inp(b,'paid_at','date',140)}${b.paid_at?'':`<br><button class="btn" style="padding:4px 12px;font-size:12px;margin-top:4px" data-bpay="${b.id}">Marcar paga hoje</button>`}</td><td>${sel(mo,b.method||'',`data-bf="${b.id}|method"`)}</td><td>${inp(b,'note','text',140)}</td><td><button class="btn" style="background:#F6D3D0;color:var(--red);padding:4px 12px;font-size:12px" data-bdel="${b.id}">Excluir</button></td></tr>`).join('')||'<tr><td colspan="9" class="k">Nenhuma conta neste filtro.</td></tr>'}</table></div></div>
<div class="two"><div class="card"><h3 style="margin-bottom:8px">Contas pagas por loja</h3><table>${Object.entries(byS).map(([k,v])=>`<tr><td>${BST[k]}</td><td class="r">${R(v)}</td></tr>`).join('')}</table></div><div class="card"><h3 style="margin-bottom:8px">Contas pagas por categoria</h3><table>${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r">${R(v)}</td><td class="r">${PC(paid?v/paid*100:0)}</td></tr>`).join('')||'<tr><td class="k">Nenhuma conta paga.</td></tr>'}</table></div></div>`;
const mg=t=>{const e=$('#bmsg');if(e){e.textContent=t;setTimeout(()=>{e.textContent=''},2000)}};
$('#bf').onchange=e=>{BF=e.target.value;bills()};$('#bs').onchange=e=>{BS=e.target.value;bills()};
$('#n_add').onclick=async()=>{const v=parseFloat($('#n_v').value.replace(/\./g,'').replace(',','.')),ds=$('#n_d').value.trim(),e=$('#n_msg');if(!ds){e.textContent='Informe a descrição.';return}if(!(v>=0)||!$('#n_v').value.trim()){e.textContent='Informe o valor.';return}
$('#n_add').disabled=true;const x=await sbB.from('bills').insert({store:$('#n_s').value,description:ds,category:$('#n_c').value,amount:v,due_date:$('#n_due').value||hj,paid_at:$('#n_p').value||null,method:$('#n_m').value||null,note:$('#n_n').value.trim()||null});if(x.error){e.textContent=x.error.message;$('#n_add').disabled=false;return}
const dd=$('#n_due').value;if(dd&&dd.slice(0,7)!=FM){FM=dd.slice(0,7);$('#fm').innerHTML=monthOpts();await load();return}bills()};
document.querySelectorAll('[data-bf]').forEach(el=>el.onchange=async()=>{const[id,c]=el.dataset.bf.split('|');let v=el.value.trim();
if(c=='amount'){v=parseFloat(v.replace(/\./g,'').replace(',','.'));if(!(v>=0)){mg('Valor inválido');return}}else if(c=='description'){if(!v){mg('Informe a descrição');return}}else if(c=='due_date'){if(!v){mg('Informe o vencimento');return}}else if(v==='')v=null;
const x=await sbB.from('bills').update({[c]:v}).eq('id',id);if(x.error){mg(x.error.message);return}if(['amount','paid_at','due_date','category','store'].includes(c))bills();else mg('Salvo ✓')});
document.querySelectorAll('[data-bpay]').forEach(b=>b.onclick=async()=>{const x=await sbB.from('bills').update({paid_at:hj}).eq('id',b.dataset.bpay);if(x.error)alert(x.error.message);else bills()});
document.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta?'))return;const x=await sbB.from('bills').delete().eq('id',b.dataset.bdel);if(x.error)alert(x.error.message);else bills()})}
function route(){document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==TAB));if(TAB=='contas')bills();else draw(LAST.m,LAST.b)}
function draw(m,b){const fat=m.fat+b.rev,op=m.op+b.op,fixed=m.fixed+b.fixed,fin=m.fin+b.fin,ped=m.ped+b.ped,pot=m.pot+b.pot,meta=m.meta+b.meta,pct=meta?fat/meta*100:0;
const now=new Date(),cur=FM==now.getFullYear()+'-'+pad2(now.getMonth()+1),[y,mo]=FM.split('-').map(Number),n=new Date(y,mo,0).getDate(),el=cur?now.getDate():n,proj=fat/Math.max(1,el)*n;
const sands=(b.prods||[]).filter(p=>/^sandu/i.test(p.n)).sort((x,y)=>x.n.localeCompare(y.n,'pt-BR'));const sand=b.cat['Sanduíches']||{q:0,v:0,c:0},gel=b.cat['Geladinhos']||{q:0,v:0,c:0};const chz=b.cat['Cheesecakes']||{q:0,v:0,c:0};
const parts=[['Mangoê · site',m.site.rev,'#F5B800'],['Mangoê · iFood',m.ifood.rev,'#C98F00'],...(sands.length?sands.map((p,i)=>['DonaLia · '+p.n.replace('Sanduíche Natural ','Sanduíche '),p.v,i?'#B5424F':'#8E1B26']):[['DonaLia · sanduíches',sand.v,'#8E1B26']]),['DonaLia · geladinhos',gel.v,'#D6677A']];

const sh=fat||1,days={};const add=(k,s,v)=>{(days[k]=days[k]||{m:0,b:0})[s]+=v};Object.entries(m.days).forEach(([k,v])=>add(k,'m',v));Object.entries(b.days).forEach(([k,v])=>add(k,'b',v));
const dl=Object.entries(days).sort((x,y)=>x[0].split('/').reverse().join('').localeCompare(y[0].split('/').reverse().join('')));const mx=Math.max(1,...dl.map(d=>d[1].m+d[1].b));
const KK=(l,v,c='')=>`<div class="card"><div class="k">${l}</div><div class="big ${c}">${v}</div></div>`;
const row=(l,v,c='')=>`<tr><td>${l}</td><td class="r ${c}">${v}</td></tr>`;
$('#main').innerHTML=`<div class="card hero"><div class="k">Sobra do mês, as duas lojas juntas, depois das despesas fixas</div><div class="big ${fin<0?'neg':''}">${R(fin)}</div><div class="k">Resultado operacional ${R(op)} − despesas fixas ${R(fixed)}. É lucro estimado, não o dinheiro em caixa.</div></div>
<div class="grid">${KK('Faturamento total',R(fat))}${KK('Pedidos · itens',ped+' · '+pot)}${KK('Margem operacional',PC(fat?op/fat*100:0),op<0?'neg':'')}${KK('Projeção do mês',R(proj))}</div>
${meta?`<div class="card" style="margin-bottom:14px"><div class="k">Meta combinada: ${R(fat)} de ${R(meta)} (${PC(pct)})</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,pct)}%;background:var(--ok)"></i></div></div>`:''}
<div class="two">
<div class="card store"><h3><span class="dot" style="background:var(--m)"></span>Mangoê</h3><table>${row('Faturamento (só itens)',R(m.fat))}${row('&nbsp;&nbsp;Site',R(m.site.rev))}${row('&nbsp;&nbsp;iFood',R(m.ifood.rev))}${row('Pedidos · potes',m.ped+' · '+m.pot)}${row('<b>Resultado operacional</b>',R(m.op),m.op<0?'neg':'')}${row('Despesas fixas',R(m.fixed))}${row('<b>Sobra do mês</b>',R(m.fin),m.fin<0?'neg':'pos')}${row('Margem operacional',PC(m.fat?m.op/m.fat*100:0))}</table><p class="k sub" style="margin-bottom:2px"><b>Potes vendidos</b></p><table><tr><th>Produto</th><th class="r">Site</th><th class="r">iFood</th><th class="r">Total</th></tr>${Object.entries(m.prods).sort((x,y)=>x[0].localeCompare(y[0],'pt-BR')).map(([n,p])=>`<tr><td>${esc(n)}</td><td class="r">${p.s}</td><td class="r">${p.i}</td><td class="r"><b>${p.s+p.i}</b></td></tr>`).join('')||'<tr><td colspan="4" class="k">Sem vendas.</td></tr>'}<tr><td><b>Total de potes</b></td><td class="r"><b>${m.site.pot}</b></td><td class="r"><b>${m.ifood.pot}</b></td><td class="r"><b>${m.pot}</b></td></tr></table><p class="k sub">iFood no plano ${m.plano=='basico'?'Básico':'Entrega'}. Resultado do iFood é estimativa do que você lançou na aba iFood da Mangoê.</p></div>
<div class="card store"><h3><span class="dot" style="background:var(--b)"></span>DonaLia Bistrô</h3><table>${row('Faturamento (só itens)',R(b.rev))}${sands.map(p=>row('&nbsp;&nbsp;'+esc(p.n)+' · '+p.q+' un.',R(p.v))).join('')}${row('&nbsp;&nbsp;<b>Total de sanduíches · '+sand.q+' un.</b>',R(sand.v))}${row('&nbsp;&nbsp;Geladinhos · '+gel.q+' un.',R(gel.v))}${row('&nbsp;&nbsp;Cheesecakes · '+chz.q+' un.',R(chz.v))}${row('Pedidos · itens',b.ped+' · '+b.pot)}${row('<b>Resultado operacional</b>',R(b.op),b.op<0?'neg':'')}${row('Despesas fixas',R(b.fixed))}${row('<b>Sobra do mês</b>',R(b.fin),b.fin<0?'neg':'pos')}${row('Margem operacional',PC(b.rev?b.op/b.rev*100:0))}</table><p class="k sub">Mês inteiro, pedidos não cancelados. Para comparar com o Financeiro do admin, escolha "Este mês" no filtro de período de lá.</p></div></div>
<div class="card" style="margin-top:14px"><h3 style="margin-bottom:10px">De onde vem o faturamento</h3><div class="bar">${parts.map(p=>`<i title="${p[0]}: ${R(p[1])}" style="width:${p[1]/sh*100}%;background:${p[2]}"></i>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px">${parts.map(p=>`<span class="k"><span class="dot" style="background:${p[2]}"></span>${p[0]}: <b>${R(p[1])}</b> (${PC(p[1]/sh*100)})</span>`).join('')}</div></div>
<div class="card" style="margin-top:14px"><h3 style="margin-bottom:10px">Faturamento por dia</h3>${dl.length?`<svg viewBox="0 0 ${Math.max(320,dl.length*30)} 160" width="100%" style="max-height:240px">${dl.map((d,i)=>{const hm=d[1].m/mx*110,hb=d[1].b/mx*110,x=i*30+4;return`<rect x="${x}" y="${128-hm}" width="22" height="${hm}" fill="#F5B800"><title>${d[0]} Mangoê: ${R(d[1].m)}</title></rect><rect x="${x}" y="${128-hm-hb}" width="22" height="${hb}" fill="#8E1B26" rx="2"><title>${d[0]} DonaLia: ${R(d[1].b)}</title></rect><text x="${x+11}" y="146" font-size="9" text-anchor="middle" fill="#5C6B5F">${d[0].slice(0,2)}</text>`}).join('')}</svg><p class="k"><span class="dot" style="background:#F5B800"></span>Mangoê (site + iFood) <span class="dot" style="background:#8E1B26;margin-left:12px"></span>DonaLia Bistrô</p>`:'<p class="k">Sem vendas neste mês.</p>'}</div>`}
start();
</script></body></html>
